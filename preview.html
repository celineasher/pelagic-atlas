function sources(s){const q=encodeURIComponent(s.scientificName);return `<div class="source-links"><a href="https://www.gbif.org/species/search?q=${q}" target="_blank" rel="noopener">GBIF ${icon('external',12)}</a><a href="https://www.fishbase.org/search.php?search=${q}" target="_blank" rel="noopener">FishBase ${icon('external',12)}</a><a href="https://www.marinespecies.org/aphia.php?p=taxlist&tName=${q}" target="_blank" rel="noopener">WoRMS ${icon('external',12)}</a><a href="https://www.iucnredlist.org/search?query=${q}&searchType=species" target="_blank" rel="noopener">IUCN ${icon('external',12)}</a></div>`}
function speciesTab(s){if(state.tab==='taxonomy')return `<section class="detail-block"><div class="eyebrow">NOMENCLATURE</div><h3>Current name and classification</h3><div class="tax-list">${[['Scientific name',s.scientificName],['Preferred common name',s.commonName],['Family',s.family],['Record source',s.source],['Scientific status',s.seed?'Check against current authority':'GBIF backbone — verify independently']].map(([a,b])=>`<div class="tax-row"><span>${h(a)}</span><strong>${h(b)}</strong></div>`).join('')}</div><div class="data-note" style="margin-top:18px">Scientific names, original combinations and synonyms may change over time. GBIF synonyms below reflect its own backbone, which can differ from Eschmeyer’s Catalog of Fishes.</div><h3 style="margin-top:25px">Historical names and synonyms</h3><div id="synonym-results"><span class="loading-pulse"></span> Looking up GBIF name history…</div></section><section class="detail-block"><h3>Reference authorities</h3><p>Use external nomenclatural resources to validate accepted names and historical combinations, including original author/year and synonym status.</p>${sources(s)}</section>`;
if(state.tab==='distribution')return `<section class="detail-block"><h3>Geographic observations</h3><p>Rotate the globe or use arrow keys. Green markers show a limited selection of GBIF records with coordinates; they are <strong>observations, not species range polygons</strong>. The distribution overview below is generalized.</p><div class="two-col"><div class="globe-card"><canvas class="globe-canvas" data-globe="species"></canvas><div class="globe-key"><i class="key-dot"></i> Verified georeferenced records (sample)</div></div><div><div class="fact-tile" style="margin-bottom:12px"><small>Generalized distribution</small><strong>${h(s.range)}</strong></div><div class="fact-tile" style="margin-bottom:12px"><small>Environment</small><strong>${h(s.habitat)} · ${h(s.zone)}</strong></div><div class="fact-tile"><small>Records available</small><strong id="gbif-count">Loading…</strong></div><div class="occurrence-status" id="occurrence-status" aria-live="polite">Looking up data…</div><div class="data-note" style="margin-top:14px">The display is a sample only. GBIF records may have spatial uncertainty or sampling bias. An absence of records does not imply an absence of fish.</div></div></div></section>`;
if(state.tab==='media')return `<section class="detail-block"><h3>Visual research studio</h3><p>Switch between licensed photographs, a diagrammatic 2D illustration, and an interactive 3D study form. <strong>3D is a generated morphological approximation, not a verified scan of this species.</strong></p><div class="media-tabs">${[['photo','Photographs'],['art','2D illustration'],['model','3D study form']].map(([k,v])=>`<button data-media="${k}" class="${state.mediaMode===k?'active':''}">${v}</button>`).join('')}</div><div id="media-panel">${mediaPanel(s)}</div></section><section class="detail-block"><h3>Contribute a verified fish model</h3><p>Future curated 3D models will be stored as GLB assets with scientific source, creator attribution, and individual license metadata. No model is represented as a specimen scan unless reviewed and licensed.</p><a href="https://www.si.edu/openaccess" target="_blank" rel="noopener" class="text-link">Explore Smithsonian open-access media ${icon('external',14)}</a></section>`;
if(state.tab==='videos')return `<section class="detail-block"><h3>Educational video</h3><p>Only explicitly curated, correctly identified videos are embedded here. For other species, use the targeted discovery link rather than risking a misidentified clip.</p>${s.scientificName==='Carcharodon carcharias'?`<div class="video-box"><iframe title="Great White Shark — National Geographic" src="https://www.youtube-nocookie.com/embed/O2FInaOCqoo" referrerpolicy="strict-origin-when-cross-origin" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe></div><p class="small-muted" style="margin-top:10px">Great White Shark · National Geographic (2007) · YouTube embed, hosted by its creator.</p>`:`<div class="video-box"><div class="video-fallback">${icon('play',40)}<strong>No independently verified embed for this species yet.</strong><a href="https://www.youtube.com/results?search_query=${encodeURIComponent(s.scientificName+' species documentary')}" target="_blank" rel="noopener">Find videos about ${h(s.scientificName)} ${icon('external',14)}</a></div></div>`}</section><section class="detail-block"><h3>Further reading</h3><p>Read source records to confirm classification, conservation assessments and ecological details. The website does not copy restricted database content wholesale.</p>${sources(s)}</section>`;
return `<div class="two-col"><section class="detail-block"><div class="eyebrow">ABOUT THE SPECIES</div><h3>Meet the ${h(s.commonName.toLowerCase())}</h3><p>${h(s.summary)}</p>${s.seed?'<p>These introductory notes were authored for this project. Biological traits can vary among populations and should be checked against cited primary literature for scientific use.</p>':'<div class="data-note">Detailed ecology has not been editorially verified for this live GBIF result. View authoritative external sources for more information.</div>'}</section><section class="detail-block"><div class="eyebrow">ECOLOGICAL PROFILE</div><h3>Habitat & behavior</h3><div class="fact-grid" style="grid-template-columns:1fr 1fr"><div class="fact-tile"><small>Environment</small><strong>${h(s.habitat)}</strong></div><div class="fact-tile"><small>Biome</small><strong>${h(s.zone)}</strong></div><div class="fact-tile"><small>Diet</small><strong>${h(s.diet)}</strong></div><div class="fact-tile"><small>Length</small><strong>${h(s.size)}</strong></div></div></section></div><section class="detail-block"><div class="heading-row"><div><div class="eyebrow">WHERE IT LIVES</div><h3 style="margin:5px 0 0">The geographic record</h3></div><button class="text-link" data-species-tab="distribution">Explore occurrences ${icon('arrow',14)}</button></div><p>${h(s.range)}. Open the distribution tab to inspect sample observation locations retrieved from GBIF with their documented source.</p></section>`}
function mediaPanel(s){if(state.mediaMode==='art')return `<div class="species-main-art" style="height:380px">${fishSVG(s)}<div class="art-caption">Original 2D study silhouette — diagrammatic, not diagnostic</div></div>`;
if(state.mediaMode==='model')return `<div id="fish-model" class="model-viewport"><div class="model-controls"><button data-model-reset="1">Reset view</button><button data-model-wire="1">Wireframe</button></div><div class="model-loader"><span class="loading-pulse"></span><p>Preparing the interactive study form…</p></div><div class="model-note">Illustrative 3D morphology · Drag to rotate · Scroll to zoom</div></div>`;
return `<div class="species-main-art" style="height:380px" data-photo-id="${attr(s.id)}"><div class="fish-illustration">${fishSVG(s)}</div><div class="art-caption" id="secondary-art-caption">Looking for licensed, species-matched Wikimedia media…</div></div>`}
function atlas(){let s=all.get(state.atlasSpecies)||uniqueSpecies[0];return chrome('Interactive globe',`<div class="eyebrow">EARTH · IN 360°</div><h1 class="page-title">Explore fish across the planet.</h1><p class="subheading">Visualize where specimens and sightings have been reported. Choose a fish to plot georeferenced GBIF records on an interactive rotating globe.</p><div class="atlas-banner">${icon('globe')}<p><strong>Scientific mapping:</strong> Green dots are real published occurrences where GBIF provides coordinates. This viewer deliberately separates observed locations from estimated range and makes no claim that every point is accurate.</p></div><div class="atlas-full"><div class="globe-card"><canvas class="globe-canvas" data-globe="main" aria-label="Interactive biodiversity globe"></canvas><div class="globe-key"><i class="key-dot"></i> Published GBIF observations · Sample only</div></div><div class="atlas-side"><div class="detail-block"><div class="eyebrow">SPECIES SELECTOR</div><h3 style="margin-top:9px">Choose a fish</h3><label class="field-label" for="atlas-fish">Species in starter catalogue</label><select class="atlas-select" id="atlas-fish">${uniqueSpecies.map(f=>`<option value="${attr(f.id)}" ${f.id===s.id?'selected':''}>${h(f.commonName)}</option>`).join('')}</select><div style="margin-top:19px"><div class="info-row"><span>Scientific name</span><span>${h(s.scientificName)}</span></div><div class="info-row"><span>Reported habitat</span><span>${h(s.habitat)}</span></div><div class="info-row"><span>Habitat overview</span><span>${h(s.zone)}</span></div></div><div class="occurrence-status" id="occurrence-status">Connecting to GBIF…</div><div style="margin-top:18px"><a class="aqua-btn" href="#/species/${s.id}" style="font-size:11px">Open species profile ${icon('arrow',14)}</a></div></div><div class="detail-block"><h3>Reading the globe</h3><p><strong>Drag</strong> to rotate · <strong>Scroll</strong> to zoom · use arrow keys for keyboard rotation.</p><div class="data-note">Map background: GSHHG coastlines. If live data is unavailable, the globe remains explorable without falsely presenting example points as observations.</div></div></div></div>`)}
function savedPage(){const saved=[...state.favorites].map(id=>all.get(id)).filter(Boolean);return chrome('Saved species',`<div class="eyebrow">YOUR FIELD JOURNAL</div><h1 class="page-title">Saved discoveries</h1><p class="subheading">Bookmark remarkable fish to revisit their profiles. Saved items are stored in this browser, not in a cloud account.</p><div class="section">${saved.length?`<div class="species-grid">${saved.map(card).join('')}</div>`:`<div class="empty-state"><div class="big-symbol">♡</div><h3>Nothing saved yet</h3><p>Use the heart on any fish card to start your own field notebook.</p><a href="#/catalog" class="aqua-btn">Find some fish ${icon('arrow',14)}</a></div>`}</div>`)}
function watchPage(){const main=uniqueSpecies[0];const picks=[uniqueSpecies[1],uniqueSpecies[4],uniqueSpecies[5],uniqueSpecies[6],uniqueSpecies[23],uniqueSpecies[53]];return chrome('Fish documentaries',`<div class="eyebrow">LIFE IN MOTION</div><h1 class="page-title">Film & field footage</h1><p class="subheading">Dive into fish behavior with verified source material. A curated example is embedded; remaining entries provide targeted video discovery until individually reviewed.</p><div class="two-col section" style="align-items:stretch"><div class="video-box"><iframe src="https://www.youtube-nocookie.com/embed/O2FInaOCqoo" title="Great white shark | National Geographic" loading="lazy" referrerpolicy="strict-origin-when-cross-origin" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div><div class="detail-block" style="margin:0;display:flex;flex-direction:column;justify-content:center"><span class="eyebrow">EDITOR'S CHOICE · VERIFIED SOURCE</span><h2 style="font:800 25px Manrope;letter-spacing:-1px;margin:10px 0">Great White Shark</h2><p>Watch a National Geographic documentary clip featuring a great white shark hunting in the ocean. Media remains hosted by YouTube and its owner.</p><p><strong>Species:</strong> <em>Carcharodon carcharias</em></p><a href="#/species/seed-1" class="text-link">Explore the species profile ${icon('arrow',14)}</a></div></div><div class="section-lg">${sectionTitle('DISCOVER MORE','Search video by species')}<div class="video-list">${picks.map(s=>`<article class="video-tile"><div class="video-thumb">${fishSVG(s,{backdrop:false})}</div><h3>${h(s.commonName)}</h3><p><em>${h(s.scientificName)}</em></p><p>No verified embed yet — browse third-party search results to find footage.</p><a href="https://www.youtube.com/results?search_query=${encodeURIComponent(s.scientificName+' fish documentary')}" target="_blank" rel="noopener">Find clips ${icon('external',13)}</a></article>`).join('')}</div></div>`)}
function about(){return chrome('About & sources',`<div class="eyebrow">THE MISSION</div><h1 class="page-title">Science first, curiosity always.</h1><p class="subheading">Pelagic Atlas is an open website prototype designed to grow into a global fish encyclopedia. Great biodiversity software should make uncertainty and sourcing visible rather than hide them.</p><div class="section-lg">${sectionTitle('HOW THIS WORKS','What this prototype can actually do')}<div class="fact-grid"><div class="fact-tile">${icon('grid',24)}<strong style="margin-top:12px">Search starter profiles</strong><p class="small-muted">${uniqueSpecies.length} deduplicated introductory fish records with custom educational summaries.</p></div><div class="fact-tile">${icon('globe',24)}<strong style="margin-top:12px">Query real observations</strong><p class="small-muted">GBIF occurrence API with coordinates displayed as separate observation markers.</p></div><div class="fact-tile">${icon('layers',24)}<strong style="margin-top:12px">2D and 3D studies</strong><p class="small-muted">Licensed photograph discovery, original illustrations and procedural 3D body forms.</p></div></div></div><section class="section-lg">${sectionTitle('SOURCE TRANSPARENCY','Authoritative biodiversity references')}<div class="detail-block"><div class="tax-list">${[
 ['Eschmeyer’s Catalog of Fishes','Nomenclatural reference, full taxonomy, historical accepted names','https://www.calacademy.org/scientists/projects/catalog-of-fishes/'],
 ['GBIF','Live taxonomic search, synonyms, vernacular names and observation records','https://www.gbif.org/'],
 ['WoRMS','Marine species naming and synonym cross-reference (outbound links only)','https://www.marinespecies.org/'],
 ['FishBase','Biology, ecology and common names (outbound links only)','https://www.fishbase.org/'],
 ['OBIS','Marine observations; planned additional dataset pipeline','https://obis.org/'],
 ['IUCN Red List','Conservation status and assessed range research (links only)','https://www.iucnredlist.org/'],
 ['Wikimedia Commons','Species photo discovery; image-by-image creator/license metadata','https://commons.wikimedia.org/'],
 ['GSHHG','Coastline data supporting the globe (not fish ranges)','https://www.soest.hawaii.edu/pwessel/gshhg/']
].map(([name,description,url])=>`<div class="tax-row" style="grid-template-columns:220px 1fr"><span><a href="${url}" target="_blank" rel="noopener" style="color:#2e8676;font-weight:800">${name} ${icon('external',12)}</a></span><span style="color:#687f79">${description}</span></div>`).join('')}</div></div></section><section class="section-lg">${sectionTitle('RESEARCH NOTES','Limitations that matter')}<div class="detail-block">${FACTS.map(f=>`<h3>${h(f.label)}</h3><p>${h(f.text)}</p>`).join('')}<p>The global count of 37,799 valid species is a dated figure, not a live site coverage metric. Complete species-by-species photographs, taxonomic revisions, conservation status, habitat polygons and authentic 3D specimen models require additional ingestion, curation, contributor permissions and dedicated infrastructure.</p></div></section>`)}
function toast(message){document.querySelector('.toast')?.remove();const el=document.createElement('div');el.className='toast';el.textContent=message;document.body.appendChild(el);setTimeout(()=>el.remove(),2600)}
function plainText(html){const d=document.createElement('div');d.innerHTML=html||'';return d.textContent?.trim().slice(0,180)||''}
async function findLicensedPhoto(s){if(photoCache.has(s.scientificName))return photoCache.get(s.scientificName);const task=(async()=>{try{const page=await request('https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&redirects=1&prop=pageimages&piprop=name%7Cthumbnail&pithumbsize=1100&titles='+encodeURIComponent(s.wikiTitle||s.scientificName),{timeout:9000});const p=Object.values(page.query?.pages||{})[0];const file=p?.pageimage;if(!file)return null;const meta=await request('https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&prop=imageinfo&iiprop=url%7Cextmetadata&iiurlwidth=1100&titles='+encodeURIComponent('File:'+file),{timeout:9000});const info=Object.values(meta.query?.pages||{})[0]?.imageinfo?.[0];const license=plainText(info?.extmetadata?.LicenseShortName?.value)||'';if(!(/^(CC\s*(?:BY|0)|Public domain|PD\b)/i.test(license))||/NC|ND/i.test(license))return null;const url=info?.thumburl||info?.url;if(!url||!/^https:\/\//.test(url))return null;return {url,license,creator:plainText(info.extmetadata?.Artist?.value)||'Creator listed on Wikimedia Commons',source:info.descriptionurl||'https://commons.wikimedia.org/wiki/'+encodeURIComponent('File:'+file)}}catch{return null}})();photoCache.set(s.scientificName,task);return task;}
let photoIO=null;
function initPhotoObserver(root=document){photoIO?.disconnect();if(typeof IntersectionObserver==='undefined'){root.querySelectorAll('[data-photo-id]').forEach(loadPhotoTarget);return}photoIO=new IntersectionObserver(entries=>{for(const e of entries){if(e.isIntersecting){photoIO.unobserve(e.target);loadPhotoTarget(e.target)}}},{rootMargin:'120px'});root.querySelectorAll('[data-photo-id]').forEach(n=>photoIO.observe(n))}
async function loadPhotoTarget(el){const s=all.get(el.dataset.photoId);if(!s)return;let photo=await findLicensedPhoto(s);if(!photo||!el.isConnected)return;const img=document.createElement('img');img.className='fish-photo';img.alt=`${s.commonName}: photo linked from Wikimedia Commons, credit ${photo.creator}`;img.loading='lazy';img.referrerPolicy='no-referrer';img.onerror=()=>img.remove();img.onload=()=>{img.classList.add('loaded');const cap=el.querySelector('.art-caption');if(cap)cap.innerHTML=`<a href="${attr(photo.source)}" target="_blank" rel="noopener" style="color:#217e6a">Wikimedia Commons · ${h(photo.license)}</a> · ${h(photo.creator.slice(0,60))}`};img.src=photo.url;el.appendChild(img)}
async function synonymResults(s){const node=document.getElementById('synonym-results');if(!node)return;try{const key=await taxonKey(s);if(!key)throw Error('No GBIF name match');const [syn,names]=await Promise.all([request(`${gbifBase}/species/${key}/synonyms?limit=80`),request(`${gbifBase}/species/${key}/vernacularNames?limit=60`)]);if(!node.isConnected)return;const synonyms=[...new Set((syn.results||[]).map(a=>a.scientificName).filter(a=>a&&a!==s.scientificName))].slice(0,16);const common=[...new Set((names.results||[]).map(a=>a.vernacularName).filter(Boolean))].slice(0,15);node.innerHTML=`${synonyms.length?`<div class="tax-list">${synonyms.map(name=>`<div class="tax-row"><span>Synonym (GBIF)</span><strong><em>${h(name)}</em></strong></div>`).join('')}</div>`:'<p>No alternate scientific names returned by the GBIF backbone. This is not proof that none exist.</p>'}<h3 style="margin-top:25px">Common names recorded by GBIF</h3>${common.length?`<p>${common.map(h).join(' · ')}</p>`:'<p>Common names were not returned by GBIF for this record.</p>'}<div class="small-muted">Data: GBIF · Taxon key ${key} · Retrieved on demand. Confirm historical names with Catalog of Fishes.</div>`;}catch{if(node.isConnected)node.innerHTML='<p>GBIF name history could not be loaded. Please use the reference links below.</p>'}}
function showSpeciesMedia(s){if(state.mediaMode==='model'){const host=document.getElementById('fish-model');if(host)mountFishModel(host,s).then(dispose=>{if(document.getElementById('fish-model')===host)modelDispose=dispose;else dispose()});}else{initPhotoObserver(document.getElementById('media-panel')||document)}}
function parseLocation(){const path=(location.hash||'#/discover').slice(2).split('?')[0];return path||'discover'}
async function route(){routeSequence++;stopMedia();photoIO?.disconnect();const path=parseLocation();window.scrollTo({top:0,behavior:'instant'});if(path==='discover'){app.innerHTML=home();initPhotoObserver();mainGlobe(null)}else if(path==='catalog'){state.page=0;state.remote=[];state.remoteError='';app.innerHTML=catalog();catalogResults();if(state.query.length>2)remoteSearch(state.query)}else if(path==='atlas'){app.innerHTML=atlas();mainGlobe(all.get(state.atlasSpecies)||uniqueSpecies[0])}else if(path==='saved'){app.innerHTML=savedPage();initPhotoObserver()}else if(path==='watch'){app.innerHTML=watchPage()}else if(path==='about'){app.innerHTML=about()}else if(path.startsWith('species/')){const id=decodeURIComponent(path.slice(8));let s=all.get(id);if(!s&&/^gbif-\d+$/.test(id)){app.innerHTML=chrome('Species profile','<div class="empty-state">Loading taxonomic record from GBIF…</div>');try{let data=await request(`${gbifBase}/species/${id.slice(5)}`);if(!classes.has(data.class||''))throw Error('Not recognized as a fish taxon');s=fromGbif(data);all.set(s.id,s)}catch{app.innerHTML=chrome('Unavailable','<div class="empty-state"><h3>Species record unavailable</h3><p>Try the search again.</p><a href="#/catalog" class="aqua-btn">Back to catalogue</a></div>');return}}
 if(!s){app.innerHTML=chrome('Not found','<div class="empty-state"><h3>Species not found</h3><a href="#/catalog" class="aqua-btn">Browse fish</a></div>');return}state.tab='overview';state.mediaMode='photo';app.innerHTML=speciesPage(s);initPhotoObserver();}else{location.hash='#/discover'}}
function goCatalogWithQuery(q){state.query=q.trim();state.filter='All fish';state.zone='All habitats';location.hash='#/catalog?q='+encodeURIComponent(state.query);if(location.hash==='#/catalog?q='+encodeURIComponent(state.query)){/* hashchange will render */}}
window.addEventListener('hashchange',route);
document.addEventListener('submit',e=>{if(e.target.id==='hero-search-form'||e.target.id==='top-search-form'){e.preventDefault();goCatalogWithQuery(e.target.querySelector('input')?.value||'')}});
document.addEventListener('click',async e=>{const go=e.target.closest('[data-go]');if(go){location.hash='#/'+go.dataset.go;return}
const save=e.target.closest('[data-save]');if(save){e.preventDefault();const id=save.dataset.save;if(state.favorites.has(id)){state.favorites.delete(id);toast('Removed from your field notebook')}else{state.favorites.add(id);toast('Saved to your field notebook')}keepSaved();save.classList.toggle('saved',state.favorites.has(id));if(save.classList.contains('outline-action')){save.innerHTML=icon('heart')+' '+(state.favorites.has(id)?'Saved':'Save species')}if(parseLocation()==='saved')route();return}
const f=e.target.closest('[data-filter]');if(f){state.filter=f.dataset.filter;state.page=0;document.querySelectorAll('[data-filter]').forEach(c=>c.classList.toggle('active',c.dataset.filter===state.filter));catalogResults();return}
const pager=e.target.closest('[data-page]');if(pager){state.page+=pager.dataset.page==='next'?1:-1;catalogResults();document.querySelector('#catalog-results')?.scrollIntoView({behavior:'smooth',block:'start'});return}
if(e.target.closest('#gbif-load-more')){loadMoreGBIF();return}
const tab=e.target.closest('[data-species-tab]');if(tab){state.tab=tab.dataset.speciesTab;modelDispose?.();modelDispose=null;activeGlobe?.destroy();activeGlobe=null;document.querySelectorAll('[data-species-tab]').forEach(n=>n.classList.toggle('active',n.dataset.speciesTab===state.tab));const s=all.get(decodeURIComponent(parseLocation().slice(8)));document.getElementById('species-tab-panel').innerHTML=speciesTab(s);if(state.tab==='distribution')mainGlobe(s);if(state.tab==='taxonomy')synonymResults(s);if(state.tab==='media')showSpeciesMedia(s);return}
